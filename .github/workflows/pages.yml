# push 到 main 就把整個 repo 當靜態網站部署到 GitHub Pages
# 網址：https://terry12260201.github.io/pumpkin-model-studio/
# 第一次：configure-pages 的 enablement 會自動幫 repo 開 Pages（來源＝GitHub Actions），不用進 Settings 手動設。
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
